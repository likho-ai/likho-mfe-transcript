# This app's files, served under /mfe/transcript/ (the gateway routes that prefix here).
server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

  location /mfe/transcript/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /mfe/transcript/ {
    # remoteEntry.js must always be fresh: it names the current assets.
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
